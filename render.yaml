# Despliegue en Render: New → Blueprint → elige este repositorio.
# Los valores con "sync: false" te los pedirá Render al crear el servicio.
services:
  - type: web
    name: mi-horario
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Base de datos MySQL de Hostinger (hPanel → Bases de datos)
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      # Correo. En el plan gratuito de Render los puertos 465 y 587 están bloqueados:
      # usa Brevo por el puerto 2525 (o cambia a un plan de pago).
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
